openapi: 3.0.0
info:
  title: Learn Rest Api assignments performance-management API
  version: '3.0'
  description: Assignment operations
servers:
- url: https://api-learn.ispring.com
  description: Main server
security:
- bearerAuth: []
tags:
- name: performance-management
paths:
  /performance-management/competencies/scale/list:
    get:
      tags:
      - performance-management
      summary: List competency scales
      operationId: ListCompetencyScales
      responses:
        '200':
          description: Success Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompetencyScale'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompetencyScale'
                xml:
                  name: response
                  wrapped: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
  /performance-management/competencies/scale/create:
    post:
      tags:
      - performance-management
      summary: Create competency scale
      operationId: CreateCompetencyScale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompetencyScaleData'
      responses:
        '200':
          description: Success Response
          content:
            application/json:
              schema:
                description: The scale ID
                type: string
                format: uuid
            application/xml:
              schema:
                description: The scale ID
                type: string
                format: uuid
