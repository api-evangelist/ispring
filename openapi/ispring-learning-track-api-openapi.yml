openapi: 3.2.0
info:
  title: Learn Rest Learning Track API
  version: '3.0'
  description: Learning track operations
servers:
- url: https://api-learn.ispring.com
  description: Main server
security:
- bearerAuth: []
tags:
- name: learning_track
  description: Learning track operations
paths:
  /learning_track/courses:
    get:
      tags:
      - learning_track
      summary: Retrieves a list of courses included in the trajectories
      operationId: ListLearningTracksCourses
      parameters:
      - name: learningTrackIds
        in: query
        required: true
        schema:
          description: Comma-separated array of track IDs
          type: string
      responses:
        '200':
          description: Success Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LearningTrackCourse'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LearningTrackCourse'
                xml:
                  name: response
                  wrapped: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
components:
  schemas:
    ErrorResponse:
      required:
      - code
      - message
      properties:
        code:
          type: integer
        message:
          type: string
      type: object
      xml:
        name: response
    LearningTrackCourse:
      required:
      - learningTrackId
      - courseId
      properties:
        learningTrackId:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
      type: object
      xml:
        name: learningTracksCourse
        wrapped: true
  responses:
    PermissionDenied:
      description: Permission Denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
        application/xml:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
        application/xml:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
        application/xml:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
